services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the whole Minitest suite against a separate test database.
  # "web" starts only if this container exits with code 0.
  test:
    build: .
    environment:
      RAILS_ENV: test
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SECRET_KEY_BASE: test-only-secret
    depends_on:
      db:
        condition: service_healthy
    command: ["./bin/rails", "test"]

  web:
    build: .
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      DB_HOST: db
      BOOK_EXPERT_DATABASE_USERNAME: ${DB_USERNAME:-postgres}
      BOOK_EXPERT_DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      test:
        condition: service_completed_successfully

volumes:
  pgdata:

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: book_expert_development

test:
  <<: *default
  database: book_expert_test

production:
  <<: *default
  database: book_expert_production
  username: <%= ENV["BOOK_EXPERT_DATABASE_USERNAME"] %>
  password: <%= ENV["BOOK_EXPERT_DATABASE_PASSWORD"] %>
